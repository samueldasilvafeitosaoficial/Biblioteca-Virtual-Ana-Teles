    let state = JSON.parse(JSON.stringify(INITIAL_STATE));
    let toastTimer = null;

    // =========================================================================
    // UTILITÁRIOS DE UI E FEEDBACK (SEM ALERT)
    // =========================================================================
    function showToast(message, icon = "✓") {
      const toast = document.getElementById("phoneToast");
      document.getElementById("toastMessage").textContent = message;
      document.getElementById("toastIcon").textContent = icon;
      toast.classList.remove("opacity-0", "-translate-y-3");
      toast.classList.add("opacity-100", "translate-y-0");

      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.remove("opacity-100", "translate-y-0");
        toast.classList.add("opacity-0", "-translate-y-3");
      }, 2800);
    }

    function setWireframeMode(enabled) {
      state.wireframeMode = enabled;
      const phoneInner = document.getElementById("phoneInner");
      const btnPolished = document.getElementById("btnPolished");
      const btnWireframe = document.getElementById("btnWireframe");
      const badge = document.getElementById("modeBadge");

      if (enabled) {
        phoneInner.classList.add("wireframe-mode");
        btnWireframe.classList.add("bg-amber-500", "text-slate-950", "shadow");
        btnWireframe.classList.remove("text-slate-300");
        btnPolished.classList.remove("bg-emerald-600", "text-white", "shadow");
        btnPolished.classList.add("text-slate-300");
        badge.textContent = "Wireframe Baixa Fidelidade";
        badge.className = "text-[11px] font-medium px-2 py-0.5 rounded-md bg-amber-500/20 text-amber-300";
      } else {
        phoneInner.classList.remove("wireframe-mode");
        btnPolished.classList.add("bg-emerald-600", "text-white", "shadow");
        btnPolished.classList.remove("text-slate-300");
        btnWireframe.classList.remove("bg-amber-500", "text-slate-950", "shadow");
        btnWireframe.classList.add("text-slate-300");
        badge.textContent = "Alta Fidelidade";
        badge.className = "text-[11px] font-medium px-2 py-0.5 rounded-md bg-emerald-500/20 text-emerald-300";
      }
      renderScreen();
    }

    function toggleSideDrawer(open) {
      const overlay = document.getElementById("sideDrawerOverlay");
      const drawer = document.getElementById("sideDrawer");
      if (open) {
        overlay.classList.remove("hidden");
        drawer.classList.remove("-translate-x-full");
      } else {
        overlay.classList.add("hidden");
        drawer.classList.add("-translate-x-full");
      }
    }

    function openModal(htmlContent) {
      const modal = document.getElementById("internalModal");
      const card = document.getElementById("internalModalCard");
      card.innerHTML = htmlContent;
      modal.classList.remove("hidden");
    }

    function closeModal() {
      document.getElementById("internalModal").classList.add("hidden");
    }

    function resetAppState() {
      const keepWireframe = state.wireframeMode;
      state = JSON.parse(JSON.stringify(INITIAL_STATE));
      state.wireframeMode = keepWireframe;
      closeModal();
      toggleSideDrawer(false);
      goToScreen(1);
      showToast("Protótipo restaurado ao estado inicial!", "↺");
    }

    // =========================================================================
    // NAVEGAÇÃO ENTRE AS 17 TELAS
    // =========================================================================
    function goToScreen(num) {
      state.currentScreen = Math.max(1, Math.min(17, num));

      // Sincronizar horários da barra de status com as páginas do PDF
      const timeMap = {
        1: "9:00", 2: "9:00", 3: "9:00",
        4: "9:01", 5: "9:01", 6: "9:01", 7: "9:01",
        8: "9:02", 9: "9:01", 10: "9:03", 11: "9:03",
        12: "9:04", 13: "9:04", 14: "9:05", 15: "9:05",
        16: "9:06", 17: "9:06"
      };
      document.getElementById("statusBarTime").textContent = timeMap[state.currentScreen] || "9:00";

      // Atualizar controles externos
      const screenJumpSelect = document.getElementById("screenJumpSelect");
      if (screenJumpSelect) screenJumpSelect.value = String(state.currentScreen);
      const currentScreenTag = document.getElementById("currentScreenTag");
      if (currentScreenTag) currentScreenTag.textContent = `Tela ${String(state.currentScreen).padStart(2, "0")} / 17`;
      updateGridHighlights();

      // Mostrar/ocultar barra de navegação inferior (telas 08 a 17)
      const bottomNav = document.getElementById("bottomNav");
      if (state.currentScreen >= 8) {
        bottomNav.classList.remove("hidden");
        updateBottomNavActive();
      } else {
        bottomNav.classList.add("hidden");
      }

      // Resetar scroll para o topo
      const container = document.getElementById("screenContainer");
      container.scrollTop = 0;
      renderScreen();
    }

    function prevScreen() {
      if (state.currentScreen > 1) goToScreen(state.currentScreen - 1);
    }

    function nextScreen() {
      if (state.currentScreen < 17) goToScreen(state.currentScreen + 1);
    }

    function updateBottomNavActive() {
      const s = state.currentScreen;
      const items = {
        "nav-home": s === 8,
        "nav-categories": s === 9 || s === 10 || s === 11,
        "nav-mybooks": s === 12 || s === 13 || s === 14,
        "nav-profile": s === 15 || s === 16 || s === 17
      };
      Object.entries(items).forEach(([id, active]) => {
        const el = document.getElementById(id);
        if (!el) return;
        if (active) {
          el.classList.add("text-emerald-600", "bg-emerald-50/80");
          el.classList.remove("text-slate-400", "hover:text-slate-600");
        } else {
          el.classList.remove("text-emerald-600", "bg-emerald-50/80");
          el.classList.add("text-slate-400", "hover:text-slate-600");
        }
      });
    }

    function buildScreenGridButtons() {
      const grid = document.getElementById("screenGridButtons");
      if (!grid) return;
      grid.innerHTML = Array.from({ length: 17 }, (_, i) => {
        const num = i + 1;
        return `<button id="gridBtn-${num}" onclick="goToScreen(${num})" class="py-1.5 rounded-lg text-xs font-bold border transition">${String(num).padStart(2, "0")}</button>`;
      }).join("");
      updateGridHighlights();
    }

    function updateGridHighlights() {
      for (let i = 1; i <= 17; i++) {
        const btn = document.getElementById(`gridBtn-${i}`);
        if (!btn) continue;
        if (i === state.currentScreen) {
          btn.className = "py-1.5 rounded-lg text-xs font-bold border border-emerald-400 bg-emerald-600 text-white shadow";
        } else {
          btn.className = "py-1.5 rounded-lg text-xs font-semibold border border-slate-700 bg-slate-900/70 text-slate-300 hover:border-slate-500 hover:text-white";
        }
      }
    }

                <button onclick="goToScreen(${s === 17 ? 16 : 15})" class="wf-card w-9 h-9 rounded-xl bg-white border border-slate-200 flex items-center justify-center text-slate-700 shadow-sm">←</button>
                <h1 class="text-xl font-extrabold text-slate-900">Informativos</h1>
              </div>

              <!-- Card Introdutório do PDF -->
              <div class="wf-accent-green rounded-3xl bg-gradient-to-br from-emerald-600 to-teal-700 p-4 text-white shadow-md">
                <div class="flex items-center gap-2 mb-1">
                  <span class="text-lg">🏫</span>
                  <h2 class="text-sm font-extrabold">Mural Biblioteca Ana Teles</h2>
                </div>
                <p class="text-xs text-emerald-50 leading-relaxed">
                  Aqui você encontra dados importantes sobre a biblioteca, como novos livros, avisos e atualizações.
                </p>
              </div>

              ${s === 16 ? `
                <!-- Lista de Informativos (Tela 16) -->
                <div class="space-y-3 pb-2">
                  ${state.notices.map(notice => `
                    <div onclick="state.selectedNoticeId=${notice.id}; goToScreen(17);"
                      class="wf-card bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm hover:border-emerald-500 transition cursor-pointer space-y-1.5">
                      <div class="flex items-center justify-between">
                        <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-md bg-amber-100 text-amber-800 text-[10px] font-bold wf-accent-amber">
                          ${notice.icon} ${notice.badge}
                        </span>
                        <span class="text-[10px] text-slate-400">${notice.date}</span>
                      </div>
                      <h3 class="text-sm font-extrabold text-slate-900">${notice.title}</h3>
                      <p class="text-xs text-slate-600 leading-relaxed">${notice.summary}</p>
                      <p class="text-[11px] font-bold text-emerald-600 pt-1">Ler comunicado completo ›</p>
                    </div>
                  `).join("")}
                </div>
              ` : `
                <!-- Detalhes do Informativo Selecionado (Tela 17) -->
                <div class="wf-card bg-white p-5 rounded-3xl border border-slate-200/80 shadow-sm space-y-3">
                  <div class="flex items-center justify-between">
                    <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-amber-100 text-amber-900 text-xs font-bold wf-accent-amber">
                      ${activeNotice.icon} ${activeNotice.badge}
                    </span>
                    <span class="text-[11px] text-slate-400">${activeNotice.date}</span>
                  </div>
                  <h2 class="text-lg font-extrabold text-slate-900 leading-snug">${activeNotice.title}</h2>
                  <p class="text-xs font-semibold text-emerald-700 bg-emerald-50 p-3 rounded-xl border border-emerald-100 wf-box">
                    "${activeNotice.summary}"
                  </p>
                  <p class="text-xs text-slate-600 leading-relaxed text-justify">
                    ${activeNotice.fullText}
                  </p>
                  <div class="pt-2">
                    <button onclick="goToScreen(16)" class="wf-primary-btn w-full py-2.5 rounded-xl bg-slate-900 text-white font-bold text-xs">
                      Ver todos os informativos
                    </button>
                  </div>
                </div>
              `}
            </div>
          `;
          break;
        }
      }
    }

    // =========================================================================
    // AÇÕES INTERATIVAS DE LIVROS, FAVORITOS E MODAIS
    // =========================================================================
    function addBookToReadingList(bookId) {
      const book = state.booksCatalog.find(b => b.id === bookId);
      if (!book) return;
      const exists = state.readingList.some(item => item.id === book.id);
      if (exists) {
        showToast(`"${book.title}" já está na sua lista Lendo!`, "📚");
        goToScreen(12);
        return;
      }
      state.readingList.unshift({
        id: book.id,
        title: book.title,
        author: book.author,
        progress: 5
      });
      showToast(`"${book.title}" adicionado a Meus Livros!`, "✓");
      renderScreen();
    }

    function updateReadingProgress(index, delta) {
      const item = state.readingList[index];
      if (!item) return;
      item.progress = Math.min(100, item.progress + delta);
      if (item.progress === 100) {
        showToast(`Parabéns! Você concluiu "${item.title}"!`, "🎉");
      } else {
        showToast(`Progresso atualizado para ${item.progress}%`, "📖");
      }
      renderScreen();
    }

    function toggleFavoriteItem(index) {
      const item = state.favoritesList[index];
      if (!item) return;
      item.favorite = !item.favorite;
      showToast(item.favorite ? `Adicionado aos favoritos!` : `Removido dos favoritos`, item.favorite ? "♥" : "♡");
      renderScreen();
    }

    function toggleFavoriteByTitle(title, author) {
      const existingIdx = state.favoritesList.findIndex(f => f.title === title);
      if (existingIdx >= 0) {
        state.favoritesList[existingIdx].favorite = !state.favoritesList[existingIdx].favorite;
        showToast(state.favoritesList[existingIdx].favorite ? `"${title}" favoritado!` : `"${title}" removido dos favoritos`, "♥");
      } else {
        state.favoritesList.unshift({ title, author, favorite: true });
        showToast(`"${title}" adicionado aos favoritos!`, "♥");
      }
      renderScreen();
    }

    function openReaderModal(bookId) {
      const book = state.booksCatalog.find(b => b.id === bookId) || state.booksCatalog[1];
      let readingItem = state.readingList.find(r => r.id === book.id);
      if (!readingItem) {
        readingItem = { id: book.id, title: book.title, author: book.author, progress: 10 };
        state.readingList.unshift(readingItem);
      }

      openModal(`
        <div class="space-y-4">
          <div class="flex items-center justify-between border-b border-slate-100 pb-3">
            <div>
              <span class="text-[10px] font-bold uppercase tracking-wider text-emerald-600">Leitor Digital Ana Teles</span>
              <h3 class="text-base font-extrabold text-slate-900">${book.title}</h3>
            </div>
            <button onclick="closeModal(); renderScreen();" class="w-8 h-8 rounded-full bg-slate-100 text-slate-600 font-bold">✕</button>
          </div>

          <div class="bg-amber-50/70 border border-amber-200/70 rounded-2xl p-4 text-xs text-slate-800 leading-relaxed font-serif space-y-2">
            <p class="font-bold text-slate-900">Capítulo 1 — Trecho de Leitura</p>
            <p>"${book.synopsis}"</p>
            <p class="text-slate-600 italic">Continue deslizando para registrar seu avanço automático na estante escolar.</p>
          </div>

          <div>
            <div class="flex justify-between text-xs font-bold mb-1">
              <span>Progresso de leitura</span>
              <span id="modalProgressVal" class="text-emerald-600">${readingItem.progress}%</span>
            </div>
            <input type="range" min="0" max="100" value="${readingItem.progress}"
              oninput="document.getElementById('modalProgressVal').textContent = this.value + '%'; setBookProgress('${book.id}', Number(this.value));"
              class="w-full accent-emerald-600" />
          </div>

          <button onclick="closeModal(); goToScreen(12);" class="w-full py-3 rounded-2xl bg-emerald-600 text-white font-bold text-xs shadow">
            Salvar progresso e ir para Meus Livros
          </button>
        </div>
      `);
    }

    function setBookProgress(bookId, val) {
      const item = state.readingList.find(r => r.id === bookId);
      if (item) item.progress = val;
    }

    function openSettingsModal() {
      openModal(`
        <div class="space-y-4">
          <div class="flex items-center justify-between border-b border-slate-100 pb-2">
            <h3 class="text-base font-extrabold text-slate-900">⚙️ Configurações</h3>
            <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-slate-100 text-slate-600 font-bold">✕</button>
          </div>
          <div class="space-y-3 text-xs">
            <label class="flex items-center justify-between p-3 rounded-xl bg-slate-50">
              <span class="font-semibold text-slate-800">Notificações de devolução escolar</span>
              <input type="checkbox" checked class="accent-emerald-600 w-4 h-4" />
            </label>
            <label class="flex items-center justify-between p-3 rounded-xl bg-slate-50">
              <span class="font-semibold text-slate-800">Avisos de novos livros no acervo</span>
              <input type="checkbox" checked class="accent-emerald-600 w-4 h-4" />
            </label>
            <label class="flex items-center justify-between p-3 rounded-xl bg-slate-50">
              <span class="font-semibold text-slate-800">Sincronização offline de leitura</span>
              <input type="checkbox" class="accent-emerald-600 w-4 h-4" />
            </label>
          </div>
          <button onclick="closeModal(); showToast('Configurações atualizadas!');" class="w-full py-2.5 rounded-xl bg-emerald-600 text-white font-bold text-xs">
            Concluir
          </button>
        </div>
      `);
    }

    function openHelpModal() {
      openModal(`
        <div class="space-y-3">
          <div class="flex items-center justify-between border-b border-slate-100 pb-2">
            <h3 class="text-base font-extrabold text-slate-900">❓ Central de Ajuda</h3>
            <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-slate-100 text-slate-600 font-bold">✕</button>
          </div>
          <p class="text-xs text-slate-600 leading-relaxed">
            Precisa de suporte com seu cadastro escolar ou empréstimo na <strong>Biblioteca Escolar Ana Teles</strong>?
          </p>
          <div class="p-3 rounded-2xl bg-emerald-50 border border-emerald-100 text-xs text-emerald-900 space-y-1">
            <p class="font-bold">Atendimento Presencial e Digital:</p>
            <p>Segunda a Sexta • 07h30 às 17h30</p>
            <p>E-mail: biblioteca@anateles.edu.br</p>
          </div>
          <button onclick="closeModal()" class="w-full py-2.5 rounded-xl bg-indigo-900 text-white font-bold text-xs">
            Entendi
          </button>
        </div>
      `);
    }

    // =========================================================================
    // INICIALIZAÇÃO
    // =========================================================================
    async function loginUser() {
      if (!window.supabaseClient) {
        showToast("O serviço de autenticação não está configurado.", "!");
        return;
      }
      const email = document.getElementById("loginEmail").value;
      const password = document.getElementById("loginPassword").value;
      try {
        const { data, error } = await window.supabaseClient.auth.signInWithPassword({
          email,
          password
        });
        if (error) {
          showToast(error.message === "Invalid login credentials"
            ? "E-mail ou senha incorretos."
            : error.message, "!");
          return;
        }
        applyAuthenticatedUser(data.user);
        showToast("Bem-vinda de volta, " + state.user.shortName + "!", "✓");
        goToScreen(8);
      } catch (error) {
        showToast("Erro ao conectar com o servidor.", "!");
      }
    }

    async function registerUser() {
      if (!window.supabaseClient) {
        showToast("O serviço de autenticação não está configurado.", "!");
        return;
      }
      const name = document.getElementById("registerName").value;
      const email = document.getElementById("registerEmail").value;
      const password = document.getElementById("registerPassword").value;
      const passwordConfirm = document.getElementById("registerPasswordConfirm").value;
      if (password !== passwordConfirm) {
        showToast("As senhas nao coincidem.", "!");
        return;
      }
      try {
        const { data, error } = await window.supabaseClient.auth.signUp({
          email,
          password,
          options: {
            data: { name },
            emailRedirectTo: window.location.origin
          }
        });
        if (error) {
          showToast(error.message, "!");
          return;
        }
        if (data.user && data.session) {
          applyAuthenticatedUser(data.user);
          showToast("Conta criada com sucesso!", "✓");
          goToScreen(5);
        } else {
          showToast("Conta criada. Confira seu e-mail para confirmar o cadastro.", "✉️");
          goToScreen(2);
        }
      } catch (error) {
        showToast("Erro ao conectar com o servidor.", "!");
      }
    }

    function applyAuthenticatedUser(user) {
      const metadata = user.user_metadata || {};
      const email = user.email || "";
      const name = (metadata.name || metadata.full_name || email.split("@")[0] || "Leitor").trim();
      state.user.name = name;
      state.user.shortName = name.split(" ")[0];
      state.user.email = email;
      document.getElementById("drawerUserName").textContent = name;
      const initials = getUserInitials();
      document.getElementById("drawerUserInitials").textContent = initials;
      const headerInitials = document.getElementById("headerUserInitials");
      if (headerInitials) headerInitials.textContent = initials;
    }

    function getUserInitials() {
      return (state.user.name || "Leitor").trim().split(/\s+/).filter(Boolean)
        .slice(0, 2).map(part => part[0]).join("").toUpperCase();
    }

    async function recoverPassword() {
      if (!window.supabaseClient) {
        showToast("O serviço de autenticação não está configurado.", "!");
        return;
      }
      const email = document.getElementById("recoveryEmail").value;
      if (!email) return;
      const { error } = await window.supabaseClient.auth.resetPasswordForEmail(email, {
        redirectTo: window.location.origin
      });
      if (error) {
        showToast(error.message, "!");
        return;
      }
      showToast("Link de recuperação enviado para seu e-mail.", "✉️");
    }

    async function logoutUser() {
      if (window.supabaseClient) {
        await window.supabaseClient.auth.signOut();
      }
      toggleSideDrawer(false);
      showToast("Sessão encerrada.", "✓");
      goToScreen(2);
    }

    async function syncSupabaseSession() {
      if (!window.SUPABASE_URL || !window.SUPABASE_ANON_KEY ||
          typeof window.supabase === "undefined") {
        return;
      }
      window.supabaseClient = window.supabase.createClient(
        window.SUPABASE_URL,
        window.SUPABASE_ANON_KEY
      );
      const { data } = await window.supabaseClient.auth.getSession();
      if (data.session?.user) {
        applyAuthenticatedUser(data.session.user);
        return true;
      }
      window.supabaseClient.auth.onAuthStateChange((event, session) => {
        if (session?.user) {
          applyAuthenticatedUser(session.user);
          if (event === "SIGNED_IN") goToScreen(8);
        }
      });
      return false;
    }

    window.addEventListener("DOMContentLoaded", () => {
      buildScreenGridButtons();
      syncSupabaseSession().then(hasSession => {
        goToScreen(hasSession ? 8 : 1);
      }).catch(() => {
        goToScreen(1);
      });

      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("/static/sw.js").catch(() => {});
      }
    });
  </script>
